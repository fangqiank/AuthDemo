<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>认证 Demo 操作台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1c1e21; }
  main { max-width: 640px; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1rem; }
  .card { background: #fff; border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size: 1.15rem; margin: 0; }
  header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .chip { font-size: .85rem; background: #e8f0fe; color: #1a56b0; border-radius: 999px; padding: .25rem .75rem; }
  button { font: inherit; border: 1px solid #c8ccd0; background: #fff; border-radius: 6px; padding: .45rem .9rem; cursor: pointer; }
  button:hover { background: #f0f2f4; }
  button.primary { background: #1a56b0; border-color: #1a56b0; color: #fff; }
  button.primary:hover { background: #14468f; }
  input { font: inherit; padding: .45rem .6rem; border: 1px solid #c8ccd0; border-radius: 6px; flex: 1; min-width: 0; }
  .row { display: flex; gap: .5rem; margin: .4rem 0; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
  .divider { text-align: center; color: #8a8f96; font-size: .8rem; margin: .75rem 0; }
  pre { background: #f4f5f7; border-radius: 6px; padding: .75rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; min-height: 1rem; font-size: .85rem; }
  .hint { color: #8a8f96; font-size: .8rem; margin: .3rem 0 0; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e3e5e8; }
    .card { background: #1f2227; box-shadow: none; }
    button { background: #262a30; border-color: #3a4048; color: inherit; }
    button:hover { background: #2f343b; }
    input { background: #16181c; border-color: #3a4048; color: inherit; }
    pre { background: #16181c; }
    .chip { background: #24354f; color: #8ab4f8; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <header>
      <h1>认证 Demo 操作台</h1>
      <span class="chip" id="who">加载中…</span>
      <button id="logout" hidden>登出</button>
    </header>
  </div>

  <div class="card" id="login" hidden>
    <div class="row">
      <input id="username" placeholder="用户名（admin / user）">
      <input id="password" type="password" placeholder="密码（admin123 / user123）">
      <button class="primary" id="loginBtn">本地登录</button>
    </div>
    <div class="divider">或第三方登录</div>
    <div class="row">
      <button onclick="location.href='/api/auth/github-login'">GitHub 登录</button>
      <button onclick="location.href='/api/auth/oidc-login'">Keycloak 登录（demo/demo123）</button>
    </div>
    <p class="hint" id="loginMsg"></p>
  </div>

  <div class="card" id="tests" hidden>
    <div class="grid">
      <button data-path="/api/auth/profile">profile（RBAC）</button>
      <button data-path="/api/auth/admin-data">admin-data（RBAC）</button>
      <button data-path="/api/auth/abac-data">abac-data（ABAC）</button>
      <button data-path="/api/documents">documents（资源型）</button>
    </div>
    <pre id="out">点击按钮测试端点…</pre>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);

async function refresh() {
  try {
    const r = await fetch('/api/auth/me');
    const me = r.status === 204 ? null : await r.json();   // Ok(null) → 204 空体
    if (me) {
      $('who').textContent = `${me.name}（${me.role} / ${me.department}）`;
      $('login').hidden = true; $('tests').hidden = false; $('logout').hidden = false;
    } else {
      $('who').textContent = '未登录';
      $('login').hidden = false; $('tests').hidden = true; $('logout').hidden = true;
      $('out').textContent = '点击按钮测试端点…';
    }
  } catch {
    $('who').textContent = '服务不可达';
  }
}

$('loginBtn').onclick = async () => {
  const r = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('username').value, password: $('password').value })
  });
  $('loginMsg').textContent = r.ok ? '登录成功' : '用户名或密码错误';
  if (r.ok) refresh();
};

$('logout').onclick = async () => { await fetch('/api/auth/logout', { method: 'POST' }); refresh(); };

document.querySelectorAll('#tests button').forEach(b => b.onclick = async () => {
  try {
    const r = await fetch(b.dataset.path);
    $('out').textContent = `GET ${b.dataset.path} → HTTP ${r.status}\n\n` + await r.text();
  } catch {
    $('out').textContent = '请求被重定向到外部登录页（会话可能已过期，请重新登录）';
  }
});

refresh();
</script>
</body>
</html>
