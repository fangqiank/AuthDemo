<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Arial, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="purpleGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="tealGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#42b883"/><stop offset="1" stop-color="#35495e"/></linearGradient>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0ea5e9"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#42b883"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a855f7"/></marker>
    <style>
      .flow-line-sky { stroke-dasharray: 8, 4; animation: dash-sky .5s linear infinite; }
      .flow-line-green { stroke-dasharray: 8, 4; animation: dash-green .5s linear infinite; }
      .flow-line-blue { stroke-dasharray: 8, 4; animation: dash-blue .5s linear infinite; }
      .flow-line-orange { stroke-dasharray: 8, 4; animation: dash-orange .5s linear infinite; }
      .flow-line-teal { stroke-dasharray: 8, 4; animation: dash-teal .5s linear infinite; }
      .flow-line-purple { stroke-dasharray: 8, 4; animation: dash-purple .5s linear infinite; }
      @keyframes dash-sky { to { stroke-dashoffset: -12; } }
      @keyframes dash-green { to { stroke-dashoffset: -12; } }
      @keyframes dash-blue { to { stroke-dashoffset: -12; } }
      @keyframes dash-orange { to { stroke-dashoffset: -12; } }
      @keyframes dash-teal { to { stroke-dashoffset: -12; } }
      @keyframes dash-purple { to { stroke-dashoffset: -12; } }
      .card-body { font-size: 12px; fill: #334155; }
      .flow-label { font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">AuthDemoAgain 认证与授权架构</text>
  <text x="600" y="60" text-anchor="middle" font-size="13" fill="#64748b">Authentication &amp; Authorization Architecture · ASP.NET Core 10</text>

  <!-- 浏览器 / SPA -->
  <g transform="translate(40,100)">
    <rect width="240" height="180" rx="12" fill="#f1f5f9" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="url(#skyGradient)"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">浏览器 / SPA</text>
    <text class="card-body" x="16" y="62">① wwwroot/index.html 零构建</text>
    <text class="card-body" x="16" y="88">② fetch 调用 /api/* 接口</text>
    <text class="card-body" x="16" y="114">③ Cookie 同源自动携带</text>
    <text class="card-body" x="16" y="140">④ 身份探测 /api/auth/me</text>
  </g>

  <!-- 认证 Authentication -->
  <g transform="translate(380,100)">
    <rect width="300" height="180" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <rect width="300" height="36" rx="12" fill="url(#purpleGradient)"/>
    <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">认证 Authentication（你是谁）</text>
    <text class="card-body" x="16" y="62">① Cookie 默认方案（30 分钟过期）</text>
    <text class="card-body" x="16" y="88">② GitHub OAuth → /signin-github</text>
    <text class="card-body" x="16" y="114">③ OIDC / Keycloak → /signin-oidc</text>
    <text class="card-body" x="16" y="140">④ ticket 事件补默认 claims 后签发 Cookie</text>
  </g>

  <!-- GitHub OAuth -->
  <g transform="translate(820,100)">
    <rect width="300" height="120" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <rect width="300" height="36" rx="12" fill="url(#greenGradient)"/>
    <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">GitHub OAuth 2.0</text>
    <text class="card-body" x="16" y="62">① authorize 授权 + code 换 token</text>
    <text class="card-body" x="16" y="88">② AspNet.Security.OAuth.GitHub</text>
  </g>

  <!-- Keycloak OIDC -->
  <g transform="translate(820,240)">
    <rect width="300" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="300" height="36" rx="12" fill="url(#blueGradient)"/>
    <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Keycloak（OIDC / IdP）</text>
    <text class="card-body" x="16" y="62">① realm authdemo · 客户端 authdemo-api</text>
    <text class="card-body" x="16" y="88">② Authorization Code + form_post · ID Token 验证</text>
  </g>

  <!-- Controllers -->
  <g transform="translate(40,310)">
    <rect width="240" height="180" rx="12" fill="#f0fdf4" stroke="#42b883" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="url(#tealGradient)"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Controllers（端点）</text>
    <text class="card-body" x="16" y="62">① AuthController /api/auth/*</text>
    <text class="card-body" x="16" y="88">② DocumentsController /api/documents</text>
    <text class="card-body" x="16" y="114">③ [Authorize(Policy = …)]</text>
    <text class="card-body" x="16" y="140">④ IAuthorizationService（资源型）</text>
  </g>

  <!-- 授权 Authorization -->
  <g transform="translate(380,310)">
    <rect width="300" height="180" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect width="300" height="36" rx="12" fill="url(#orangeGradient)"/>
    <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">授权 Authorization（你能去哪）</text>
    <text class="card-body" x="16" y="62">① RBAC：AdminOnly · UserOrAdmin</text>
    <text class="card-body" x="16" y="88">② ABAC：ItDepartmentOnly（department）</text>
    <text class="card-body" x="16" y="114">③ 资源型：DocumentOwner（Owner==Name）</text>
    <text class="card-body" x="16" y="140">④ 判断收敛于 Handler，端点零权限 if</text>
  </g>

  <!-- Mock 存储 -->
  <g transform="translate(40,520)">
    <rect width="240" height="140" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="240" height="36" rx="12" fill="url(#blueGradient)"/>
    <text x="120" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">内存 Mock 存储</text>
    <text class="card-body" x="16" y="62">MockUserStore：用户/角色/部门</text>
    <text class="card-body" x="16" y="88">MockDocumentStore：标题/Owner</text>
    <text class="card-body" x="16" y="114">（演示用，无数据库）</text>
  </g>

  <!-- 流程说明 -->
  <g transform="translate(320,520)">
    <rect width="480" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="13" font-weight="bold" fill="#1e293b">流程说明</text>
    <text class="card-body" x="16" y="50">① 本地登录：校验 MockUserStore → claims(Name/Role/department) → 签发 Cookie</text>
    <text class="card-body" x="16" y="76">② 第三方登录：Challenge → IdP 授权 → code 换 token → 验证身份 → 补 claims → 签发 Cookie</text>
    <text class="card-body" x="16" y="102">③ 访问 API：认证中间件解 Cookie → [Authorize] 按 Policy 交 Handler 判定 → 端点</text>
    <text class="card-body" x="16" y="126">④ 四种授权形态共用一套 Policy/Requirement/Handler 机制</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(830,520)">
    <rect width="330" height="140" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="16" y="26" font-size="13" font-weight="bold" fill="#1e293b">图例</text>
    <line x1="16" y1="48" x2="56" y2="48" stroke="#dcfce7" stroke-width="6" stroke-linecap="round"/><line x1="16" y1="48" x2="56" y2="48" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="66" y="52">GitHub OAuth 流程</text>
    <line x1="190" y1="48" x2="230" y2="48" stroke="#dbeafe" stroke-width="6" stroke-linecap="round"/><line x1="190" y1="48" x2="230" y2="48" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="240" y="52">OIDC / 数据</text>
    <line x1="16" y1="78" x2="56" y2="78" stroke="#f3e8ff" stroke-width="6" stroke-linecap="round"/><line x1="16" y1="78" x2="56" y2="78" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="66" y="82">认证方案流</text>
    <line x1="190" y1="78" x2="230" y2="78" stroke="#ffedd5" stroke-width="6" stroke-linecap="round"/><line x1="190" y1="78" x2="230" y2="78" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="240" y="82">身份/策略</text>
    <line x1="16" y1="108" x2="56" y2="108" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/><line x1="16" y1="108" x2="56" y2="108" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="66" y="112">浏览器请求</text>
    <line x1="190" y1="108" x2="230" y2="108" stroke="#d1fae5" stroke-width="6" stroke-linecap="round"/><line x1="190" y1="108" x2="230" y2="108" stroke="#42b883" stroke-width="3" stroke-linecap="round"/>
    <text class="card-body" x="240" y="112">控制器流</text>
    <text class="card-body" x="16" y="132" fill="#94a3b8">在浏览器打开本 .svg 可见流动动画</text>
  </g>

  <!-- 流程连线（双层结构） -->
  <!-- 浏览器 → 认证 -->
  <path d="M280 190 L380 190" stroke="#e0f2fe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M280 190 L380 190" class="flow-line-sky" stroke="#0ea5e9" stroke-width="3" fill="none" marker-end="url(#arrowSky)" stroke-linecap="round"/>
  <text class="flow-label" x="286" y="182">HTTP + Cookie</text>

  <!-- 认证 → GitHub -->
  <path d="M680 145 L820 145" stroke="#dcfce7" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M680 145 L820 145" class="flow-line-green" stroke="#22c55e" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" stroke-linecap="round"/>
  <text class="flow-label" x="692" y="137">authorize / code</text>

  <!-- 认证 → Keycloak -->
  <path d="M680 250 L820 285" stroke="#dbeafe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M680 250 L820 285" class="flow-line-blue" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <text class="flow-label" x="686" y="262">auth code / ID Token</text>

  <!-- 认证 → 授权 -->
  <path d="M530 280 L530 310" stroke="#ffedd5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M530 280 L530 310" class="flow-line-orange" stroke="#f97316" stroke-width="3" fill="none" marker-end="url(#arrowOrange)" stroke-linecap="round"/>
  <text class="flow-label" x="540" y="300">ClaimsPrincipal</text>

  <!-- 授权 → Controllers -->
  <path d="M380 395 L280 395" stroke="#d1fae5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M380 395 L280 395" class="flow-line-teal" stroke="#42b883" stroke-width="3" fill="none" marker-end="url(#arrowTeal)" stroke-linecap="round"/>
  <text class="flow-label" x="292" y="387">Policy 判定</text>

  <!-- Controllers → 存储 -->
  <path d="M160 490 L160 520" stroke="#dbeafe" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M160 490 L160 520" class="flow-line-blue" stroke="#3b82f6" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" stroke-linecap="round"/>
  <text class="flow-label" x="170" y="510">读取</text>
</svg>
